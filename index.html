<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Milagros_py</title><link rel="stylesheet" href="style.css"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;padding:0;background-color:#0a051e}.background-container{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;overflow:hidden}.background-image{width:100%;height:100%;object-fit:cover;filter:blur(5px) brightness(.5);transform:scale(1.05)}.background-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at center,rgba(254,253,255,.3) 0,rgba(10,5,25,.7) 100%)}</style></head><body><div class="background-container"><img src="foto.png" alt="Fondo" class="background-image"><div class="background-overlay"></div></div><div id="playerPage" class="page active"><div class="music-player-container"><div class="music-player-box"><div class="player-header"><img id="albumArt" src="https://placehold.co/100x100/3a3a4e/e0e0e0?text=..." alt="Album Art" class="album-art-player"><div class="track-info-player"><h2 id="playerTrackTitle">Cargando...</h2><p id="playerTrackArtist">...</p></div></div><div id="lyricsContainer" class="lyrics-container"><p>Cargando...</p></div><div class="player-controls"><div class="progress-section-player"><div id="playerProgressBarContainer" class="progress-bar-container-player"><div id="playerProgressBar" class="progress-bar-player"></div></div><div class="time-display-player"><span id="playerCurrentTime">0:00</span><span id="playerTotalDuration">2:30</span></div></div><div class="main-controls-player"><button id="playerPlayPauseBtn" class="control-btn-player play-pause-player"><i class="fas fa-play"></i></button></div><div class="secondary-controls-player"><div class="volume-control-player"><i class="fas fa-volume-down volume-icon-player"></i><input type="range" id="playerVolumeSlider" class="volume-slider-player" min="0" max="1" step="0.01" value="0.8"><i class="fas fa-volume-up volume-icon-player ml-1"></i></div><div class="playback-speed-control"><i class="fas fa-tachometer-alt speed-icon"></i><input type="range" id="playerSpeedSlider" class="speed-slider" min="0.5" max="2.0" step="0.25" value="1.0"><span id="currentSpeedDisplay">1.0x</span></div></div></div><p class="footer-credit">// dedicated to Milagros</p></div></div></div><audio id="audioPlayer"></audio><script src="script.js"></script></body></html>
