<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 Forbidden - Access Denied</title>
    <style>
        body {
            background-color: #000;
            color: #d1d1d1;
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .content {
            max-width: 450px;
            padding: 30px;
            border-left: 3px solid #e74c3c;
            background: #111;
        }
        h1 {
            color: #fff;
            font-size: 22px;
            margin: 0 0 10px 0;
            font-weight: 600;
        }
        p {
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .notice {
            color: #e74c3c;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .admin-contact {
            color: #888;
            font-size: 14px;
        }
        .admin-contact strong {
            color: #bbb;
        }
    </style>
</head>
<body>

<div class="content">
    <div class="notice">Security Alert</div>
    <h1>Access Denied</h1>
    <p>Your IP address has been <strong>temporarily blocked.</strong></p>
    
    <div class="admin-contact">
        Contact the <strong> administrator</strong> to request an unblock.
    </div>
</div>

</body>
</html>
